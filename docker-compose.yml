services:
  citybus:
    # Published image — no build needed. To build from source instead, run
    #   docker build -t citybus-pwa:local .
    # and change this line to `image: citybus-pwa:local`.
    image: giorgospap777/citybus-pwa:latest
    container_name: citybus
    restart: unless-stopped
    # A backstop only: the caches are capped, and the app uses ~40 MB. If memory
    # ever runs away anyway, the container restarts instead of starving the host.
    mem_limit: 256m

    environment:
      PORT: 3000
      # City the app opens on. Users can change it in the app's settings.
      DEFAULT_CITY: irakleio
      DEFAULT_LANG: el
      CACHE_DIR: /data

    volumes:
      # Keeps bearer tokens and stop lists across restarts.
      - citybus-cache:/data

    # Nginx Proxy Manager forwards here. If NPM runs in Docker on this same
    # host, prefer the shared-network option in DEPLOY.md and delete this
    # block — then nothing is exposed on the LAN at all.
    ports:
      - "3000:3000"

volumes:
  citybus-cache:
